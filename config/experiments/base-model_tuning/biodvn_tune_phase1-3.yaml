# BioDVN Phase 1.3 – HP Screening (30% of data)
#
# Fixed values are held constant; any parameter with a "suggest" block
# is searched by Optuna.  Comment/uncomment suggest blocks to control
# which HPs are active in each run.

name: biodvn_tune_phase1-3
output_dir: results_training/biodvn_phase1_3_training

transfer: ~

objective:
  metric: tumor_gvw_crps_mean
  direction: minimize

tuning:
  phase: "1.3"             # 1.0 = 10%, 1.3 = 30%, 3.0 = 100%
  n_trials_per_fold: 300
  prev_study: ~
  top_fraction: 0.2
  enqueue_top_k: 3

data:
  training_set: data/BTS_sample-splits.tsv
  zarr_base: /hpc/temp/ha_g/user/rpatton/ProteusZarrs
  subsample_frac: 0.30
  seed: 23

# =========================================================================
# GROUP 1: Structural HPs  (10 - architecture, input ablation, loss weights)
# =========================================================================
structural:
  # Architecture choices (fixed at v1 baseline)
  vae_objective: beta_vae
  # vae_objective:
  #   suggest: {type: categorical, choices: [beta_vae, beta_tcvae]}

  # Boolean input ablation toggles (Optuna categorical true/false)
  # use_tfx is vestigial – TFX is always excluded from encoder input;
  # the GRL discriminator predicts TFX from latents instead.
  use_tfx: true
  use_gb_features: true
  use_grl: true
  # beta_grl: 1.0 # (0.1 - 5.0)
  beta_grl:
    suggest: {type: float, low: 0.01, high: 2.0, log: true}

  # Loss weights
  # beta_background: 1.0
  # beta_vae: 3.0
  # beta_contrastive: 0.5
  # beta_reconstruction: 1.5
  # cl_margin: 0.5
  # internal_weight: 2.5
  beta_background:
    suggest: {type: float, low: 0.1, high: 5.0, log: true}
  beta_vae:
    suggest: {type: float, low: 0.1, high: 10.0, log: true}
  beta_contrastive:
    suggest: {type: float, low: 0.1, high: 5.0, log: true}
  beta_reconstruction:
    suggest: {type: float, low: 0.1, high: 5.0, log: true}
  cl_margin:
    suggest: {type: float, low: 0.1, high: 5.0, log: true}
  internal_weight:
    suggest: {type: float, low: 0.1, high: 10.0, log: true}


# =========================================================================
# GROUP 2: Training HPs  (8 - optimizer, schedule, regularisation)
# =========================================================================
# N.B. 1 epoch on 30% of data (4 folds, ~80% of total) is ~20250 steps
training:
  # Bounds:
  epochs: 21
  patience: 3
  use_amp: true
  # Everything else > currently optimized for 10% data based on phase1-0
  # max_lr: 0.0015  # (5e-4 - 5e-3)
  # min_lr_ratio: 6.7e-4  # (1e-4 - 1e-2)
  # warmup_start_lr: 1e-4 # (3e-5 - 1e-4)
  # warmup_frac: 0.01 # (0.01 - 0.10)
  # schedule_frac: 0.20 # (0.33 - 1.0)
  # weight_decay: 1e-4 # (1e-5 - 2e-3)
  # norm_type: batchnorm
  # max_grad_norm: 2.5 # (0.5 - 4.0)
  max_lr:
    suggest: {type: float, low: 1.0e-4, high: 1.0e-2, log: true}
  min_lr_ratio:
    suggest: {type: float, low: 1.0e-4, high: 1.0e-1, log: true}
  warmup_start_lr:
    suggest: {type: float, low: 0.0, high: 1.0e-4}
  warmup_frac:
    suggest: {type: float, low: 0.01, high: 0.10}
  schedule_frac:
    suggest: {type: float, low: 0.5, high: 1.0}  # 10-20 epochs
  weight_decay:
    suggest: {type: float, low: 1.0e-5, high: 1.0e-2, log: true}
  norm_type:
    suggest: {type: categorical, choices: [batchnorm, layernorm, groupnorm]}
  max_grad_norm:
    suggest: {type: float, low: 0.5, high: 5.0}


# =========================================================================
# GROUP 3: Scale HPs  (13 - width, depth, capacity)
# =========================================================================
scale:
  signal_ksize: 6
  interaction_ksize: 3
  n_reductions: 3
  reduction_dilation_small: 1
  reduction_dilation_large: 11
  encoder_start: 128
  latent_size: 32
  decoder_start: 16
  mdn_hidden: 64
  mdn_final: 16
  signal_filters: 16
  initial_reduction_channels: 64
  dropout_rate: 0.20 # (0.05 - 0.20)
  # signal_ksize:
  #   suggest: {type: categorical, choices: [3, 6, 9]}
  # interaction_ksize:
  #   suggest: {type: categorical, choices: [3, 5, 7]}
  # n_reductions:
  #   suggest: {type: int, low: 2, high: 4}
  # reduction_dilation_small:
  #   suggest: {type: categorical, choices: [1, 2, 3]}
  # reduction_dilation_large:
  #   suggest: {type: categorical, choices: [7, 11, 15]}
  # encoder_start:
  #   suggest: {type: categorical, choices: [64, 128, 256]}
  # latent_size:
  #   suggest: {type: categorical, choices: [16, 32, 64]}
  # decoder_start:
  #   suggest: {type: categorical, choices: [8, 16, 32]}
  # mdn_hidden:
  #   suggest: {type: categorical, choices: [32, 64, 128]}
  # mdn_final:
  #   suggest: {type: categorical, choices: [8, 16, 32]}
  # signal_filters:
  #   suggest: {type: categorical, choices: [8, 16, 32]}
  # initial_reduction_channels:
  #   suggest: {type: categorical, choices: [32, 64, 128]}
  # dropout_rate:
  #   suggest: {type: float, low: 0.05, high: 0.35}