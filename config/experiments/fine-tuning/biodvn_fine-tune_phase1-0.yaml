# BioDVN PAN-FT Phase 1.0 – Patient fine-tuning (5-fold CV)
#
# Standard model (BioDVN).
# Base weights: trained_models/proteus_base-model/full_train/best_model.pt
# PAN-FT: 38 CRPC-RA + 16 SCLC + 20 PHT (PDX admixtures)
# 5-fold stratified CV, cohort-balanced sampling, PHT always train-only.

name: biodvn_fine-tune_phase1-0
output_dir: results_training/biodvn_fine-tune_phase1-0

transfer:
  base_weights: trained_models/proteus_base-model/full_train/best_model.pt
  freeze_mode:
    suggest: {type: categorical, choices: [full_unfreeze, backbone_only, backbone_plus_encoders, decoder_plus_heads, heads_only]}
  backbone_lr_multiplier:
    suggest: {type: float, low: 0.01, high: 0.50, log: true}

data:
  training_set: data/PAN-FT_sample-splits.tsv
  zarr_base: /hpc/temp/ha_g/user/rpatton/ProteusZarrs
  seed: 23
  subsample_frac: 1.0
  train_only_cohorts: [PHT]
  balance_cohorts: [CRPC-RA, SCLC]

structural:
  beta_point_mse: 0.30
  beta_background: 2.0
  beta_tcvae: 2.0
  beta_contrastive: 1.0
  beta_grl: 0.15
  beta_reconstruction: 0.50
  cl_margin: 1.0
  internal_weight: 1.0

training:
  epochs:
    suggest: {type: int, low: 5, high: 30, step: 5}
  patience: 999
  use_amp: true
  min_lr_ratio: 5.0e-4
  warmup_start_lr: 2.5e-4
  warmup_frac: 0.10
  schedule_frac: 0.90
  max_grad_norm: 18.0
  max_lr:
    suggest: {type: float, low: 1.0e-5, high: 0.0015, log: true}
  weight_decay:
    suggest: {type: float, low: 1.0e-6, high: 1.0e-3, log: true}

scale:
  signal_ksize: 6
  interaction_ksize: 3
  n_reductions: 3
  reduction_dilation: 3
  signal_encoder_width: 256
  encoder_start: 128
  latent_size: 64
  decoder_start: 64
  mdn_hidden: 64
  mdn_final: 32
  signal_filters: 16
  initial_reduction_channels: 64
  dropout_rate:
    suggest: {type: float, low: 0.10, high: 0.50, step: 0.05}

objective:
  metric: balanced_tumor_gvw_crps_mean
  direction: minimize

tuning:
  promote_top_frac: 0.05
  phase: "1.0"
  n_trials_per_fold: 100
  pruner_type: hyperband
