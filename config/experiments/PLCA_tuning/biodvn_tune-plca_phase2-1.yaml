# BioDVN PLCA Phase 2.1 – Longer training + GRL tuning (narrowed from phase 2.0)
#
# Key changes from phase 2.0:
#   - epochs: 15 → 20 (top configs were still improving at epoch 15)
#   - beta_grl: fixed 0.5 → tunable [0.0, 0.5] (CRPC-RA, the weak source, may
#     be hurt by TFX-invariance pressure; the other sources are synthetic with
#     controlled TFX, so the GRL may be erasing genuinely informative signal)
#   - beta_tcvae: narrowed [2, 9] → [2, 5] (6+ consistently underperformed)
#   - beta_reconstruction: widened floor [0.5, 2.0] → [0.25, 1.0] (top trials
#     piled at 0.5 floor; test whether lower still helps)
#   - internal_weight: narrowed [0.1, 2.0] → [0.2, 0.8] (>0.8 dead zone)
#   - max_lr: narrowed to confirmed sweet-spot [5e-5, 3e-4]
#   - weight_decay: narrowed [1e-6, 1e-4] → [1e-6, 2e-5] (top trials < 1.2e-5)
#   - ema_decay: fixed at 0.9999 (clear winner, 0.99 actively hurt performance)
#   - warmup_frac: fixed at 0.05 (1.8% importance, not worth tuning)
#   - beta_point_mse: fixed at 0.15 (0.3% importance, not worth tuning)
#   - dropout_rate: fixed at 0.50 (6.4% importance, plateau above 0.40)
#   - enqueue_top_k: 5 (seed the top 5 configs from phase 2.0)
#   - n_trials_per_fold: 40 (focused search, fewer wasted trials)

name: biodvn_tune-plca_phase2-1
output_dir: results_training/biodvn_plca_phase2_1_training

transfer: ~

objective:
  metric: balanced_tumor_gvw_r_lower_bound
  direction: maximize

tuning:
  phase: "2.1"
  n_trials_per_fold: 40
  prev_study: ~
  top_fraction: 0.10
  enqueue_top_k: 0
  pruner_type: none

data:
  training_set: data/PLCA_sample-splits.tsv
  zarr_base: /hpc/temp/ha_g/user/rpatton/ProteusZarrs
  subsample_frac: 1.00
  seed: 23
  batch_mode: multi_source
  source_groups:
    CRPC-RA: [CRPC-RA]
    SCLC: [SCLC]
    Prostate-Synthetic: [PC-PDX]
    SCLC-Synthetic: [SCLC-PDX]
  target_n_per_source: 24


# =========================================================================
# GROUP 1: Structural HPs  (loss weights)
# =========================================================================
structural:
  beta_point_mse: 0.15
  beta_background: 1.0
  beta_tcvae:
    suggest: {type: float, low: 1.0, high: 5.0, step: 1.0}
  beta_contrastive: 1.0
  beta_grl:
    suggest: {type: float, low: 0.0, high: 0.5, step: 0.1}
  beta_reconstruction:
    suggest: {type: float, low: 0.25, high: 1.25, step: 0.25}
  cl_margin: 1.0
  internal_weight:
    suggest: {type: float, low: 0.25, high: 1.25, step: 0.25}


# =========================================================================
# GROUP 2: Training HPs  (optimizer, schedule, regularisation)
# =========================================================================
training:
  epochs: 20
  patience: 20
  use_amp: true
  ema_decay: 0.9999
  min_lr_ratio: 0.01
  warmup_start_lr: 1.0e-5
  warmup_frac: 0.05
  schedule_frac: 0.90
  max_grad_norm: 10.0
  max_lr:
    suggest: {type: float, low: 1.0e-5, high: 1.0e-3, log: true}
  weight_decay:
    suggest: {type: float, low: 1.0e-6, high: 1.0e-4, log: true}


# =========================================================================
# GROUP 3: Scale HPs  (fixed at phase 1.6 architecture)
# =========================================================================
scale:
  signal_ksize: 6
  interaction_ksize: 3
  n_reductions: 3
  reduction_dilation: 3
  encoder_start: 512
  latent_size: 128
  decoder_start: 64
  mdn_hidden: 64
  mdn_final: 16
  signal_filters: 16
  initial_reduction_channels: 64
  dropout_rate:
    suggest: {type: float, low: 0.1, high: 0.5, step: 0.1}
