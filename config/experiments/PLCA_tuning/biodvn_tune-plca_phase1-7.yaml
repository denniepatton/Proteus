# BioDVN PLCA Phase 1.7 – Sequential CV tuning (cross-fold objective)

name: biodvn_tune-plca_phase1-7
output_dir: results_training/biodvn_plca_phase1_7_training

transfer: ~

objective:
  metric: min_tumor_gvw_r
  direction: maximize

tuning:
  phase: "1.7"
  n_trials_per_fold: 100
  prev_study: biodvn_tune-plca_phase1-6
  top_fraction: 0.20
  enqueue_top_k: 10
  pruner_type: none

data:
  training_set: data/PLCA_sample-splits.tsv
  zarr_base: /hpc/temp/ha_g/user/rpatton/ProteusZarrs
  subsample_frac: 1.00
  seed: 23
  batch_mode: multi_source
  source_groups:
    CRPC-RA: [CRPC-RA]
    SCLC: [SCLC]
    Prostate-Synthetic: [PC-PDX]
    SCLC-Synthetic: [SCLC-PDX]
  target_n_per_source: 24


# =========================================================================
# GROUP 1: Structural HPs  (loss weights)
# =========================================================================
structural:
  beta_point_mse:
    suggest: {type: float, low: 0.05, high: 0.25, step: 0.05}
  beta_background: 1.0
  beta_tcvae:
    suggest: {type: float, low: 3.0, high: 7.0, step: 1.0}
  beta_contrastive: 1.0
  beta_grl: 0.5
  beta_reconstruction: 1.0
  cl_margin: 1.0
  internal_weight:
    suggest: {type: float, low: 0.3, high: 0.7, step: 0.1}


# =========================================================================
# GROUP 2: Training HPs  (optimizer, schedule, regularisation)
# =========================================================================
training:
  epochs: 20
  patience: 20
  use_amp: true
  ema_decay:
    suggest: {type: categorical, choices: [0.999, 0.9999]}
  min_lr_ratio: 0.01
  warmup_start_lr: 1.0e-5
  warmup_frac:
    suggest: {type: float, low: 0.05, high: 0.15, step: 0.05}
  schedule_frac: 0.90
  max_grad_norm: 10.0
  max_lr:
    suggest: {type: float, low: 4.0e-5, high: 2.0e-4, log: true}
  weight_decay:
    suggest: {type: float, low: 1.0e-6, high: 1.0e-5, log: true}


# =========================================================================
# GROUP 3: Scale HPs  (fixed at phase 1.6 architecture)
# =========================================================================
scale:
  signal_ksize: 6
  interaction_ksize: 3
  n_reductions: 3
  reduction_dilation: 3
  encoder_start: 512
  latent_size: 128
  decoder_start: 64
  mdn_hidden: 64
  mdn_final: 16
  signal_filters: 16
  initial_reduction_channels: 64
  dropout_rate:
    suggest: {type: float, low: 0.25, high: 0.35, step: 0.05}
