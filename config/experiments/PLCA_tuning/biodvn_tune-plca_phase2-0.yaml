# BioDVN PLCA Phase 2.0 – Coordinated fold-parallel tuning (narrowed from phase 1.8)

name: biodvn_tune-plca_phase2-0
output_dir: results_training/biodvn_plca_phase2_0_training

transfer: ~

objective:
  metric: balanced_tumor_gvw_r_lower_bound
  direction: maximize

tuning:
  phase: "2.0"
  n_trials_per_fold: 100
  prev_study: biodvn_tune-plca_phase1-8
  top_fraction: 0.10
  enqueue_top_k: 3
  pruner_type: none

data:
  training_set: data/PLCA_sample-splits.tsv
  zarr_base: /hpc/temp/ha_g/user/rpatton/ProteusZarrs
  subsample_frac: 1.00
  seed: 23
  batch_mode: multi_source
  source_groups:
    CRPC-RA: [CRPC-RA]
    SCLC: [SCLC]
    Prostate-Synthetic: [PC-PDX]
    SCLC-Synthetic: [SCLC-PDX]
  target_n_per_source: 24


# =========================================================================
# GROUP 1: Structural HPs  (loss weights)
# =========================================================================
structural:
  beta_point_mse:
    suggest: {type: float, low: 0.00, high: 0.30, step: 0.05}
  beta_background: 1.0
  beta_tcvae:
    suggest: {type: float, low: 2.0, high: 9.0, step: 1.0}
  beta_contrastive: 1.0
  beta_grl: 0.5
  beta_reconstruction:
    suggest: {type: float, low: 0.5, high: 2.0, step: 0.25}
  cl_margin: 1.0
  internal_weight:
    suggest: {type: float, low: 0.1, high: 2.0, step: 0.1}


# =========================================================================
# GROUP 2: Training HPs  (optimizer, schedule, regularisation)
# =========================================================================
training:
  epochs: 15
  patience: 15
  use_amp: true
  ema_decay:
    suggest: {type: categorical, choices: [0.99, 0.999, 0.9999]}
  min_lr_ratio: 0.01
  warmup_start_lr: 1.0e-5
  warmup_frac:
    suggest: {type: float, low: 0.0, high: 0.20, step: 0.05}
  schedule_frac: 0.90
  max_grad_norm: 10.0
  max_lr:
    suggest: {type: float, low: 1.0e-5, high: 1.0e-3, log: true}
  weight_decay:
    suggest: {type: float, low: 1.0e-6, high: 1.0e-4, log: true}


# =========================================================================
# GROUP 3: Scale HPs  (fixed at phase 1.6 architecture)
# =========================================================================
scale:
  signal_ksize: 6
  interaction_ksize: 3
  n_reductions: 3
  reduction_dilation: 3
  encoder_start: 512
  latent_size: 128
  decoder_start: 64
  mdn_hidden: 64
  mdn_final: 16
  signal_filters: 16
  initial_reduction_channels: 64
  dropout_rate:
    suggest: {type: float, low: 0.10, high: 0.50, step: 0.05}
