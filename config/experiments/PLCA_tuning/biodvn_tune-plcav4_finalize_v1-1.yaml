# BioDVN PLCAv4 — coordinated full-CV finalize sweep v1-1
#
# This finalize pass evaluates each Optuna config across all 5 folds to
# completion. Fold workers run in coordinated mode and finalize phases use the
# fixed-schedule final-model evaluation contract.

name: biodvn_tune-plcav4_finalize_v1-1
output_dir: results_training/biodvn_plcav4_finalize_v1_1_tuning

transfer: ~

objective:
  metric: cohort_tumor_soft_objective_mean
  direction: minimize

tuning:
  phase: "plcav4_v1-1_finalize"
  n_trials_per_fold: 32
  prev_study: biodvn_tune-plcav4-4_fast-sweep
  top_fraction: 0.10
  enqueue_top_k: 1
  promote_top_frac: 0.0
  max_promotions: 0
  pruner_type: none

data:
  training_set: data/PLCA_sample-splits.tsv
  zarr_base: /hpc/temp/ha_g/user/rpatton/ProteusZarrs
  subsample_frac: 1.00
  seed: 23
  batch_mode: multi_source
  steps_per_epoch: 4000
  selection_metric: min_cohort_soft_objective
  source_groups:
    CRPC-RA: [CRPC-RA]
    SCLC: [SCLC]
    Prostate-Synthetic: [PC-PDX]
    SCLC-Synthetic: [SCLC-PDX]

structural:
  beta_ccc:
    suggest: {type: categorical, choices: [0.1, 0.2, 0.3]}
  beta_background: 1.0
  beta_kl: 1.0
  beta_contrastive: 1.0
  beta_tfx: 0.5
  beta_pht_consistency: 1.0
  beta_pht_uncertainty: 1.0
  beta_reconstruction:
    suggest: {type: categorical, choices: [2.0, 3.0, 5.0]}
  beta_srl_max:
    suggest: {type: categorical, choices: [1.0, 2.0, 3.0]}
  srl_delta: 5.0
  srl_start: 0
  srl_ramp:
    suggest: {type: categorical, choices: [25, 50, 75, 100]}
  cl_margin: 1.0
  internal_weight: 0.5

training:
  epochs: 100
  patience: 100
  use_amp: false
  ema_decay:
    suggest: {type: categorical, choices: [0.95, 0.99, 0.995]}
  grad_accum_steps: 1
  min_lr_ratio: 0.01
  warmup_start_lr: 1.0e-5
  warmup_frac: 0.05
  schedule_frac: 0.90
  max_grad_norm: 10.0
  max_lr:
    suggest: {type: float, low: 1.0e-4, high: 3.0e-4, log: true}
  weight_decay: 0.0

scale:
  signal_ksize: 3
  interaction_ksize: 5
  n_reductions: 3
  funnel_reduction_factor: 4
  reduction_dilation: 3
  encoder_start: 256
  latent_size: 128
  decoder_start: 64
  mdn_hidden: 64
  mdn_final: 32
  signal_filters: 16
  initial_reduction_channels: 64
  dropout_rate: 0.25