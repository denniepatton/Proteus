# BioDVN PLCA Phase 1.6 – Architecture changes + narrowed HP ranges
#
# Architecture changes from 1.5:
#   - Signal encoder: flatten+dense MLP (~4.7M) → Conv1d(k=1)+AdaptiveAvgPool1d (~1K)
#     Imposes translation invariance along TSS window, eliminates over-parameterization.
#   - Weight predictor: Linear(513→2) → MLP(513→32→2) for nonlinear merge weighting.
#   - decoder_start: 128→64 (was degenerate single-layer; now 128→64→89 two-layer).
#   - signal_encoder_width removed (dead HP after pooling change).
#
# HP changes from 1.5:
#   - Narrowed ranges based on 17 completed 1.5 trials
#   - beta_tcvae: [2, 9], max_lr: [5e-5, 4e-4], weight_decay: [1e-6, 5e-5]
#   - dropout: [0.15, 0.30]
#   - Opened internal_weight [0.1, 1.0] and beta_point_mse [0.0, 0.3] as tunable
#   - Increased epochs to 20, patience 20, pruner disabled
#   - prev_study seeds top-3 from phase 1.5


name: biodvn_tune-plca_phase1-6
output_dir: results_training/biodvn_plca_phase1_6_training

transfer: ~

objective:
  metric: min_tumor_gvw_r
  direction: maximize

tuning:
  phase: "1.6"
  n_trials_per_fold: 200
  prev_study: biodvn_tune-plca_phase1-5
  top_fraction: 0.1
  enqueue_top_k: 3
  pruner_type: none

data:
  training_set: data/PLCA_sample-splits.tsv
  zarr_base: /hpc/temp/ha_g/user/rpatton/ProteusZarrs
  subsample_frac: 1.00
  seed: 23
  batch_mode: multi_source
  source_groups:
    CRPC-RA: [CRPC-RA]
    SCLC: [SCLC]
    Prostate-Synthetic: [PC-PDX]
    SCLC-Synthetic: [SCLC-PDX]
  target_n_per_source: 24


# =========================================================================
# GROUP 1: Structural HPs  (loss weights)
# =========================================================================
structural:
  beta_point_mse:
    suggest: {type: float, low: 0.0, high: 0.3, step: 0.05}
  beta_background: 1.0
  beta_tcvae:
    suggest: {type: float, low: 2.0, high: 9.0, step: 1.0}
  beta_contrastive: 1.0
  beta_grl: 0.5
  beta_reconstruction: 1.0
  cl_margin: 1.0
  internal_weight:
    suggest: {type: float, low: 0.1, high: 1.0, step: 0.1}


# =========================================================================
# GROUP 2: Training HPs  (optimizer, schedule, regularisation)
# =========================================================================
training:
  epochs: 20
  patience: 20
  use_amp: true
  ema_decay:
    suggest: {type: categorical, choices: [0.999, 0.9999]}
  min_lr_ratio:
    suggest: {type: categorical, choices: [0.01, 0.10]}
  warmup_start_lr: 1.0e-5
  warmup_frac:
    suggest: {type: float, low: 0.00, high: 0.30, step: 0.05}
  schedule_frac: 0.90
  max_grad_norm: 10.0
  max_lr:
    suggest: {type: float, low: 5.0e-5, high: 4.0e-4, log: true}
  weight_decay:
    suggest: {type: float, low: 1.0e-6, high: 5.0e-5, log: true}


# =========================================================================
# GROUP 3: Scale HPs  (fixed at phase 1.3 winners)
# =========================================================================
scale:
  signal_ksize: 6
  interaction_ksize: 3
  n_reductions: 3
  reduction_dilation: 3
  encoder_start: 512
  latent_size: 128
  decoder_start: 64
  mdn_hidden: 64
  mdn_final: 16
  signal_filters: 16
  initial_reduction_channels: 64
  dropout_rate:
    suggest: {type: float, low: 0.15, high: 0.30, step: 0.05}
