# BioDVN PLCAv3 — finalization sweep v3-3
#
# Robust full-CV finalization pass.  This targets worst-fold weighted tumor
# GVW-CRPS directly and reopens the low-regularization/funnel-4 region that
# produced low-basin folds in v3-1 while keeping internal_weight fixed.

name: biodvn_tune-plcav3_finalize_v3-3
output_dir: results_training/biodvn_plcav3_finalize_v3_3_tuning

transfer: ~

objective:
  metric: weighted_tumor_gvw_crps_max
  direction: minimize

tuning:
  phase: "plcav3_v3-3_finalize"
  n_trials_per_fold: 64
  prev_study: ~
  top_fraction: 0.50
  enqueue_top_k: 0
  promote_top_frac: 0.0
  max_promotions: 0
  pruner_type: none

data:
  training_set: data/PLCA_sample-splits.tsv
  zarr_base: /hpc/temp/ha_g/user/rpatton/ProteusZarrs
  subsample_frac: 1.00
  seed: 23
  batch_mode: multi_source
  steps_per_epoch: 4000
  selection_metric: min_weighted_source_crps
  source_groups:
    CRPC-RA: [CRPC-RA]
    SCLC: [SCLC]
    Prostate-Synthetic: [PC-PDX]
    SCLC-Synthetic: [SCLC-PDX]

structural:
  beta_ccc:
    suggest: {type: categorical, choices: [1.0, 1.5, 2.0]}
  beta_background: 1.0
  beta_kl:
    suggest: {type: categorical, choices: [1.5, 2.0, 2.5]}
  beta_contrastive: 1.0
  beta_tfx:
    suggest: {type: categorical, choices: [1.0, 1.5, 2.0]}
  beta_pht_consistency:
    suggest: {type: categorical, choices: [0.0, 0.25, 0.5]}
  beta_pht_uncertainty:
    suggest: {type: categorical, choices: [0.0, 0.5, 1.0]}
  beta_reconstruction:
    suggest: {type: categorical, choices: [0.5, 0.75, 1.0]}
  cl_margin: 1.0
  internal_weight: 0.5

training:
  epochs: 100
  patience: 100
  use_amp: true
  ema_decay:
    suggest: {type: categorical, choices: [0.0, 0.95, 0.99, 0.995, 0.999]}
  grad_accum_steps: 4
  min_lr_ratio: 0.01
  warmup_start_lr: 1.0e-5
  warmup_frac: 0.05
  schedule_frac: 0.90
  max_grad_norm: 10.0
  max_lr:
    suggest: {type: float, low: 1.0e-4, high: 1.0e-3, log: true}
  weight_decay:
    suggest: {type: float, low: 1.0e-7, high: 1.0e-5, log: true}

scale:
  signal_ksize: 6
  interaction_ksize: 3
  n_reductions: 3
  funnel_reduction_factor:
    suggest: {type: categorical, choices: [2, 4]}
  reduction_dilation: 3
  encoder_start: 256
  latent_size: 128
  decoder_start: 64
  mdn_hidden: 64
  mdn_final: 16
  signal_filters: 8
  initial_reduction_channels: 32
  dropout_rate:
    suggest: {type: categorical, choices: [0.20, 0.25, 0.30]}