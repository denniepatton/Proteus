# BioDVN PLCA Phase 1.5 – Multi-source gene-conditioned batches + EMA
#

name: biodvn_tune-plca_phase1-5
output_dir: results_training/biodvn_plca_phase1_5_training

transfer: ~

objective:
  metric: min_tumor_gvw_r
  direction: maximize

tuning:
  phase: "1.5"
  n_trials_per_fold: 200
  prev_study: ~
  top_fraction: 0.1
  enqueue_top_k: 3
  pruner_type: hyperband

data:
  training_set: data/PLCA_sample-splits.tsv
  zarr_base: /hpc/temp/ha_g/user/rpatton/ProteusZarrs
  subsample_frac: 1.00
  seed: 23
  batch_mode: multi_source
  source_groups:
    CRPC-RA: [CRPC-RA]
    SCLC: [SCLC]
    Prostate-Synthetic: [PC-PDX]
    SCLC-Synthetic: [SCLC-PDX]
  target_n_per_source: 24


# =========================================================================
# GROUP 1: Structural HPs  (loss weights)
# =========================================================================
structural:
  beta_point_mse: 0.0
  beta_background: 1.0
  beta_tcvae:
    suggest: {type: float, low: 1.0, high: 10.0, step: 1.0}
  beta_contrastive: 1.0
  beta_grl: 0.5
  beta_reconstruction: 1.0
  cl_margin: 1.0
  internal_weight: 1.0


# =========================================================================
# GROUP 2: Training HPs  (optimizer, schedule, regularisation)
# =========================================================================
training:
  epochs: 15
  patience: 15
  use_amp: true
  ema_decay:
    suggest: {type: categorical, choices: [0.999, 0.9999]}
  min_lr_ratio:
    suggest: {type: categorical, choices: [0.01, 0.10]}
  warmup_start_lr: 1.0e-5
  warmup_frac:
    suggest: {type: float, low: 0.00, high: 0.30, step: 0.05}
  schedule_frac: 0.90
  max_grad_norm: 10.0
  max_lr:
    suggest: {type: float, low: 1.0e-5, high: 1.0e-3, log: true}
  weight_decay:
    suggest: {type: float, low: 1.0e-6, high: 1.0e-4, log: true}


# =========================================================================
# GROUP 3: Scale HPs  (fixed at phase 1.3 winners)
# =========================================================================
scale:
  signal_ksize: 6
  interaction_ksize: 3
  n_reductions: 3
  reduction_dilation: 3
  signal_encoder_width: 1024
  encoder_start: 512
  latent_size: 128
  decoder_start: 128
  mdn_hidden: 128
  mdn_final: 16
  signal_filters: 16
  initial_reduction_channels: 64
  dropout_rate:
    suggest: {type: float, low: 0.10, high: 0.30, step: 0.05}
