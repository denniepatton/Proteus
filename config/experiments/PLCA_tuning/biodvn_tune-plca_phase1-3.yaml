# BioDVN PLCA Phase 1.3 – Min-source GVW-r objective, narrowed LR
#
# Fixed values are held constant; any parameter with a "suggest" block
# is searched by Optuna.

name: biodvn_tune-plca_phase1-3
output_dir: results_training/biodvn_plca_phase1_3_training

transfer: ~

objective:
  metric: min_tumor_gvw_r
  direction: maximize

tuning:
  phase: "1.3"
  n_trials_per_fold: 200
  prev_study: ~
  top_fraction: 0.1
  enqueue_top_k: 3
  pruner_type: hyperband

data:
  training_set: data/PLCA_sample-splits.tsv
  zarr_base: /hpc/temp/ha_g/user/rpatton/ProteusZarrs
  subsample_frac: 1.00
  seed: 23
  source_groups:
    CRPC-RA: [CRPC-RA]
    SCLC: [SCLC]
    Prostate-Synthetic: [PC-PDX]
    SCLC-Synthetic: [SCLC-PDX]
  target_n_per_source: 40


# =========================================================================
# GROUP 1: Structural HPs  (loss weights)
# =========================================================================
structural:
  beta_point_mse: 0.0
  beta_background: 1.0
  beta_tcvae:
    suggest: {type: float, low: 2.0, high: 10.0, step: 2.0}
  beta_contrastive: 1.0
  beta_grl: 0.5
  beta_reconstruction: 1.0
  cl_margin: 1.0
  internal_weight:
    suggest: {type: float, low: 1.0, high: 5.0, step: 1.0}


# =========================================================================
# GROUP 2: Training HPs  (optimizer, schedule, regularisation)
# =========================================================================
training:
  epochs: 20
  patience: 5
  use_amp: true
  min_lr_ratio:
    suggest: {type: float, low: 1.0e-4, high: 1.0e-2, log: true}
  warmup_start_lr: 1.0e-5
  warmup_frac:
    suggest: {type: float, low: 0.10, high: 0.30, step: 0.05}
  schedule_frac: 0.90
  max_grad_norm: 10.0
  max_lr:
    suggest: {type: float, low: 1.0e-5, high: 1.0e-3, log: true}
  weight_decay:
    suggest: {type: float, low: 1.0e-6, high: 1.0e-4, log: true}


# =========================================================================
# GROUP 3: Scale HPs  (fixed at base model convergence)
# =========================================================================
scale:
  signal_ksize: 6
  interaction_ksize: 3
  n_reductions: 3
  reduction_dilation: 3
  signal_encoder_width:
    suggest: {type: categorical, choices: [512, 1024]}
  encoder_start:
    suggest: {type: categorical, choices: [256, 512]}
  latent_size:
    suggest: {type: categorical, choices: [64, 128]}
  decoder_start: 64
  mdn_hidden: 64
  mdn_final: 16
  signal_filters: 16
  initial_reduction_channels: 64
  dropout_rate:
    suggest: {type: float, low: 0.15, high: 0.25, step: 0.05}
