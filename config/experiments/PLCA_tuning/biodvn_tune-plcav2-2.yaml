# BioDVN PLCAv2-2 — widened proxy-fold tuning
#
# Follow-up study after the preliminary PLCA full-train/CV runs.
# Uses the same proxy-fold orchestration as the current refine study:
# folds 3/5 scout on RTX, then promising configs are completed on folds 1/2/4
# on L40 workers. Patience is shorter than the prior 25-epoch proxy pass so
# clearly stale configs finish sooner, but promotion still depends only on
# completed fold metrics, so the proxy/L40 handoff is unchanged.
#
# Sized for roughly 72 hours of proxy scouting on 16 RTX workers while leaving
# headroom for completion folds on 4 L40 workers.

name: biodvn_tune-plcav2-2
output_dir: results_training/biodvn_plcav2_2_tuning

transfer: ~

objective:
  metric: weighted_tumor_gvw_crps_mean
  direction: minimize

tuning:
  phase: "plcav2_2"
  n_trials_per_fold: 40
  prev_study: ~
  top_fraction: 0.10
  enqueue_top_k: 0
  pruner_type: none

data:
  training_set: data/PLCA_sample-splits.tsv
  zarr_base: /hpc/temp/ha_g/user/rpatton/ProteusZarrs
  subsample_frac: 1.00
  seed: 23
  batch_mode: chunk
  selection_metric: min_weighted_source_crps
  source_groups:
    CRPC-RA: [CRPC-RA]
    SCLC: [SCLC]
    Prostate-Synthetic: [PC-PDX]
    SCLC-Synthetic: [SCLC-PDX]

structural:
  beta_point_mse:
    suggest: {type: categorical, choices: [0.0, 0.10, 0.25, 0.35]}
  beta_background: 1.0
  beta_tcvae:
    suggest: {type: categorical, choices: [1.0, 1.25, 1.5, 1.75, 2.0]}
  beta_contrastive: 1.0
  beta_grl:
    suggest: {type: categorical, choices: [0.0, 0.10, 0.20, 0.30]}
  beta_reconstruction:
    suggest: {type: categorical, choices: [0.10, 0.25, 0.50, 0.75]}
  cl_margin: 1.0
  internal_weight:
    suggest: {type: categorical, choices: [0.10, 0.25, 0.50, 0.75, 1.00]}

training:
  epochs: 25
  patience: 8
  use_amp: true
  ema_decay: 0.9999
  min_lr_ratio: 0.01
  warmup_start_lr: 1.0e-5
  warmup_frac: 0.05
  schedule_frac: 0.90
  max_grad_norm: 10.0
  max_lr:
    suggest: {type: float, low: 5.0e-5, high: 3.0e-4, log: true}
  weight_decay:
    suggest: {type: float, low: 5.0e-7, high: 4.0e-6, log: true}

scale:
  signal_ksize: 6
  interaction_ksize: 3
  n_reductions: 3
  reduction_dilation: 3
  encoder_start: 512
  latent_size: 128
  decoder_start: 64
  mdn_hidden: 64
  mdn_final: 16
  signal_filters: 16
  initial_reduction_channels: 64
  dropout_rate:
    suggest: {type: categorical, choices: [0.10, 0.15, 0.20, 0.25, 0.30]}