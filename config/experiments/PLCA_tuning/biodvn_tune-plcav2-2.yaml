# BioDVN PLCAv2-2 — widened proxy-fold tuning
#
# Uses the same proxy-fold orchestration as the current refine study:
# folds 3/5 scout on RTX, then promising configs are completed on folds 1/2/4
# on L40 workers. Patience is shorter than the prior 25-epoch proxy pass so
# clearly stale configs finish sooner, but promotion still depends only on
# completed fold metrics, so the proxy/L40 handoff is unchanged.
#
# Sized for roughly 72 hours of proxy scouting on 16 RTX workers while leaving
# headroom for completion folds on 4 L40 workers.

name: biodvn_tune-plcav2-2
output_dir: results_training/biodvn_plcav2_2_tuning

transfer: ~

objective:
  metric: weighted_tumor_gvw_crps_mean
  direction: minimize

tuning:
  phase: "plcav2_2"
  n_trials_per_fold: 40
  prev_study: ~
  top_fraction: 0.10
  enqueue_top_k: 0
  pruner_type: none

data:
  training_set: data/PLCA_sample-splits.tsv
  zarr_base: /hpc/temp/ha_g/user/rpatton/ProteusZarrs
  subsample_frac: 1.00
  seed: 23
  batch_mode: chunk
  selection_metric: min_weighted_source_crps
  source_groups:
    CRPC-RA: [CRPC-RA]
    SCLC: [SCLC]
    Prostate-Synthetic: [PC-PDX]
    SCLC-Synthetic: [SCLC-PDX]

structural:
  beta_point_mse:
    suggest: {type: float, low: 0.00, high: 0.50, step: 0.10}
  beta_background: 1.0
  beta_tcvae:
    suggest: {type: float, low: 1.0, high: 2.0, step: 0.25}
  beta_contrastive: 1.0
  beta_grl:
    suggest: {type: float, low: 0.0, high: 0.50, step: 0.10}
  beta_reconstruction:
    suggest: {type: float, low: 0.25, high: 1.00, step: 0.25}
  cl_margin: 1.0
  internal_weight:
    suggest: {type: float, low: 0.25, high: 1.00, step: 0.25}

training:
  epochs: 25
  patience: 3
  use_amp: true
  ema_decay:
    suggest: {type: categorical, choices: [0.9999, 0.999, 0.99, 0.9, 0.0]}
  min_lr_ratio: 0.01
  warmup_start_lr: 1.0e-5
  warmup_frac: 0.05
  schedule_frac: 0.90
  max_grad_norm: 10.0
  max_lr:
    suggest: {type: float, low: 1.0e-5, high: 3.0e-4, log: true}
  weight_decay:
    suggest: {type: float, low: 1.0e-7, high: 5.0e-6, log: true}

scale:
  signal_ksize: 6
  interaction_ksize: 3
  n_reductions: 3
  reduction_dilation: 3
  encoder_start:
    suggest: {type: categorical, choices: [256, 512, 1024]}
  latent_size:
    suggest: {type: categorical, choices: [32, 64, 128]}
  decoder_start: 64
  mdn_hidden: 64
  mdn_final:
    suggest: {type: categorical, choices: [8, 16, 32]}
  signal_filters: 16
  initial_reduction_channels: 64
  dropout_rate:
    suggest: {type: float, low: 0.10, high: 0.30, step: 0.05}