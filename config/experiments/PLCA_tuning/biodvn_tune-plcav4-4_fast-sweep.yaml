# BioDVN PLCAv4-4 — soft-max source objective fold-5 scout

name: biodvn_tune-plcav4-4_fast-sweep
output_dir: results_training/biodvn_plcav4_4_fast_sweep

transfer: ~

objective:
  metric: cohort_tumor_soft_objective
  direction: minimize

tuning:
  phase: "plcav4_4_fast_sweep"
  n_trials_per_fold: 10
  prev_study: ~
  top_fraction: 0.0
  enqueue_top_k: 0
  promote_top_frac: 0
  max_promotions: 0
  pruner_type: hyperband

data:
  training_set: data/PLCA_sample-splits.tsv
  zarr_base: /hpc/temp/ha_g/user/rpatton/ProteusZarrs
  subsample_frac: 1.00
  seed: 23
  batch_mode: multi_source
  steps_per_epoch: 4000
  selection_metric: min_cohort_soft_objective
  source_groups:
    CRPC-RA: [CRPC-RA]
    SCLC: [SCLC]
    Prostate-Synthetic: [PC-PDX]
    SCLC-Synthetic: [SCLC-PDX]

structural:
  beta_ccc:
    suggest: {type: categorical, choices: [0.0, 0.05, 0.25, 0.5, 1.0]}
  beta_background: 1.0
  beta_kl: 1.0
  beta_contrastive: 1.0
  beta_tfx:
    suggest: {type: categorical, choices: [0.5, 1.0, 2.0]}
  beta_pht_consistency:
    suggest: {type: categorical, choices: [0.5, 1.0, 1.5, 2.0, 3.0]}
  beta_pht_uncertainty: 1.0
  beta_reconstruction:
    suggest: {type: categorical, choices: [0.5, 1.0, 1.5, 2.0, 3.0]}
  beta_srl_max:
    suggest: {type: categorical, choices: [0.25, 0.50, 1.0, 1.5, 2.0]}
  srl_delta:
    suggest: {type: categorical, choices: [3.0, 5.0, 10.0]}
  srl_start:
    suggest: {type: categorical, choices: [0, 5, 10, 25, 50]}
  srl_ramp:
    suggest: {type: categorical, choices: [10, 25, 50]}
  cl_margin: 1.0
  internal_weight: 0.5

training:
  epochs: 100
  patience: 25
  use_amp: false
  ema_decay:
    suggest: {type: categorical, choices: [0.0, 0.95, 0.99, 0.995, 0.999]}
  grad_accum_steps: 1
  min_lr_ratio: 0.01
  warmup_start_lr: 1.0e-5
  warmup_frac: 0.05
  schedule_frac: 0.90
  max_grad_norm: 10.0
  max_lr:
    suggest: {type: float, low: 1.0e-4, high: 5.0e-4, log: true}
  weight_decay: 0.0

scale:
  signal_ksize: 3
  interaction_ksize: 5
  n_reductions: 3
  funnel_reduction_factor: 4
  reduction_dilation: 3
  encoder_start: 256
  latent_size: 128
  decoder_start: 64
  mdn_hidden: 64
  mdn_final: 32
  signal_filters: 16
  initial_reduction_channels: 64
  dropout_rate:
    suggest: {type: categorical, choices: [0.20, 0.25, 0.30]}