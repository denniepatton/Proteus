# BioDVN PLCAv3 — finalization sweep v3-5

name: biodvn_tune-plcav3_finalize_v3-5
output_dir: results_training/biodvn_plcav3_finalize_v3_5_tuning

transfer: ~

objective:
  metric: weighted_tumor_gvw_crps_max
  direction: minimize

tuning:
  phase: "plcav3_v3-5_finalize"
  n_trials_per_fold: 64
  prev_study: ~
  top_fraction: 0
  enqueue_top_k: 0
  promote_top_frac: 0
  max_promotions: 2
  pruner_type: none

data:
  training_set: data/PLCA_sample-splits.tsv
  zarr_base: /hpc/temp/ha_g/user/rpatton/ProteusZarrs
  subsample_frac: 1.00
  seed: 23
  batch_mode: multi_source
  steps_per_epoch: 4000
  selection_metric: min_weighted_source_crps
  source_groups:
    CRPC-RA: [CRPC-RA]
    SCLC: [SCLC]
    Prostate-Synthetic: [PC-PDX]
    SCLC-Synthetic: [SCLC-PDX]

structural:
  beta_ccc:
    suggest: {type: categorical, choices: [0.5, 1.0, 1.5, 2.0, 3.0]}
  beta_background: 1.0
  beta_kl: 1.0
  beta_contrastive: 1.0
  beta_tfx:
    suggest: {type: categorical, choices: [1.0, 1.5, 2.0]}
  beta_pht_consistency:
    suggest: {type: categorical, choices: [0.0, 0.5, 1.0, 1.5, 2.0]}
  beta_pht_uncertainty:
    suggest: {type: categorical, choices: [0.0, 0.5, 1.0, 1.5, 2.0]}
  beta_reconstruction: 1.25
  cl_margin: 1.0
  internal_weight: 0.5

training:
  epochs: 100
  patience: 100
  use_amp: true
  ema_decay: 0.0
  grad_accum_steps:
    suggest: {type: categorical, choices: [1, 2, 4]}
  min_lr_ratio: 0.01
  warmup_start_lr: 1.0e-5
  warmup_frac: 0.05
  schedule_frac: 0.90
  max_grad_norm: 10.0
  max_lr:
    suggest: {type: float, low: 1.0e-4, high: 1.0e-3, log: true}
  weight_decay:
    suggest: {type: float, low: 1.0e-9, high: 1.0e-7, log: true}

scale:
  signal_ksize:
    suggest: {type: categorical, choices: [3, 6, 9]}
  interaction_ksize:
    suggest: {type: categorical, choices: [3, 5, 7]}
  n_reductions: 3
  funnel_reduction_factor:
    suggest: {type: categorical, choices: [2, 4]}
  reduction_dilation: 3
  encoder_start: 256
  latent_size: 128
  decoder_start: 64
  mdn_hidden: 64
  mdn_final:
    suggest: {type: categorical, choices: [16, 32]}
  signal_filters:
    suggest: {type: categorical, choices: [4, 8, 16]}
  initial_reduction_channels:
    suggest: {type: categorical, choices: [16, 32, 64]}
  dropout_rate:
    suggest: {type: categorical, choices: [0.20, 0.25, 0.30]}