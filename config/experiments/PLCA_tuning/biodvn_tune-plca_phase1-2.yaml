# BioDVN PLCA Phase 1.2 – Min-source GVW-r objective, narrowed LR
#
# Fixed values are held constant; any parameter with a "suggest" block
# is searched by Optuna.

name: biodvn_tune-plca_phase1-2
output_dir: results_training/biodvn_plca_phase1_2_training

transfer: ~

objective:
  metric: min_tumor_gvw_r
  direction: maximize

tuning:
  phase: "1.2"
  n_trials_per_fold: 200
  prev_study: ~
  top_fraction: 0.1
  enqueue_top_k: 3
  pruner_type: hyperband

data:
  training_set: data/PLCA_sample-splits.tsv
  zarr_base: /hpc/temp/ha_g/user/rpatton/ProteusZarrs
  subsample_frac: 1.00
  seed: 23
  source_groups:
    CRPC-RA: [CRPC-RA]
    SCLC: [SCLC]
    Prostate-Synthetic: [PC-PDX]
    SCLC-Synthetic: [SCLC-PDX]
  target_n_per_source: 40


# =========================================================================
# GROUP 1: Structural HPs  (loss weights)
# =========================================================================
structural:
  beta_point_mse:
    suggest: {type: float, low: 0.00, high: 1.00, step: 0.25}
  beta_background:
    suggest: {type: float, low: 0.5, high: 2.5, step: 0.5}
  beta_tcvae:
    suggest: {type: float, low: 2.0, high: 10.0, step: 2.0}
  beta_contrastive:
    suggest: {type: float, low: 0.5, high: 1.5, step: 0.25}
  beta_grl:
    suggest: {type: float, low: 0.0, high: 1.0, step: 0.25}
  beta_reconstruction:
    suggest: {type: float, low: 0.5, high: 2.5, step: 0.5}
  cl_margin:
    suggest: {type: float, low: 0.5, high: 2.5, step: 0.5}
  internal_weight:
    suggest: {type: float, low: 0.5, high: 2.5, step: 0.5}


# =========================================================================
# GROUP 2: Training HPs  (optimizer, schedule, regularisation)
# =========================================================================
training:
  epochs:
    suggest: {type: categorical, choices: [15, 20, 25]}
  patience: 3
  use_amp: true
  min_lr_ratio: 1.0e-3
  warmup_start_lr: 1.0e-4
  warmup_frac: 0.10
  schedule_frac: 0.90
  max_grad_norm: 10.0
  max_lr:
    suggest: {type: float, low: 0.0001, high: 0.01, log: true}
  weight_decay:
    suggest: {type: float, low: 1.0e-6, high: 1.0e-3, log: true}


# =========================================================================
# GROUP 3: Scale HPs  (fixed at base model convergence)
# =========================================================================
scale:
  signal_ksize: 6
  interaction_ksize: 3
  n_reductions: 3
  reduction_dilation: 3
  signal_encoder_width: 256
  encoder_start: 128
  latent_size: 64
  decoder_start: 64
  mdn_hidden: 64
  mdn_final: 32
  signal_filters: 16
  initial_reduction_channels: 64
  dropout_rate:
    suggest: {type: float, low: 0.15, high: 0.35, step: 0.05}
