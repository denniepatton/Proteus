# BioDVN PLCAv2 — weighted source GVW-CRPS tuning
#
# Search is intentionally narrow and centered on a single new training recipe:
#   - chunk-based all-data loader with real sample mixing
#   - weighted source GVW-CRPS objective (0.3/0.3/0.2/0.2)
#   - compact coarse-binned spatial encoder
#
# The search focuses on the HPs most likely to interact with the new
# loader/encoder reset without reopening a broad architecture sweep.

name: biodvn_tune-plcav2_weighted
output_dir: results_training/biodvn_plcav2_weighted_tuning

transfer: ~

objective:
  metric: weighted_tumor_gvw_crps_mean
  direction: minimize

tuning:
  phase: "plcav2"
  n_trials_per_fold: 60
  prev_study: ~
  top_fraction: 0.10
  enqueue_top_k: 0
  pruner_type: none

data:
  training_set: data/PLCA_sample-splits.tsv
  zarr_base: /hpc/temp/ha_g/user/rpatton/ProteusZarrs
  subsample_frac: 1.00
  seed: 23
  batch_mode: chunk
  selection_metric: min_weighted_source_crps
  source_groups:
    CRPC-RA: [CRPC-RA]
    SCLC: [SCLC]
    Prostate-Synthetic: [PC-PDX]
    SCLC-Synthetic: [SCLC-PDX]

structural:
  beta_point_mse:
    suggest: {type: categorical, choices: [0.15, 0.25, 0.35]}
  beta_background: 1.0
  beta_tcvae:
    suggest: {type: categorical, choices: [1.0, 1.25, 1.5, 2.0]}
  beta_contrastive: 1.0
  beta_grl:
    suggest: {type: categorical, choices: [0.0, 0.05, 0.10, 0.20]}
  beta_reconstruction:
    suggest: {type: categorical, choices: [0.0, 0.25, 0.50]}
  cl_margin: 1.0
  internal_weight:
    suggest: {type: categorical, choices: [0.25, 0.50, 0.75]}

training:
  epochs: 20
  patience: 20
  use_amp: true
  ema_decay: 0.9999
  min_lr_ratio: 0.01
  warmup_start_lr: 1.0e-5
  warmup_frac: 0.05
  schedule_frac: 0.90
  max_grad_norm: 10.0
  max_lr:
    suggest: {type: float, low: 1.0e-4, high: 6.0e-4, log: true}
  weight_decay:
    suggest: {type: float, low: 1.0e-6, high: 2.0e-5, log: true}

scale:
  signal_ksize: 6
  interaction_ksize: 3
  n_reductions: 3
  reduction_dilation: 3
  encoder_start: 512
  latent_size: 128
  decoder_start: 64
  mdn_hidden: 64
  mdn_final: 16
  signal_filters: 16
  initial_reduction_channels: 64
  dropout_rate:
    suggest: {type: float, low: 0.10, high: 0.25, step: 0.05}