# BioDVN Phase 3.1 – HP Screening (100% of data)
#
# Fixed values are held constant; any parameter with a "suggest" block
# is searched by Optuna.  Comment/uncomment suggest blocks to control
# which HPs are active in each run.

name: biodvn_tune_phase3-1
output_dir: results_training/biodvn_phase3_1_training

transfer: ~

objective:
  metric: tumor_gvw_crps_mean
  direction: minimize

tuning:
  phase: "3.1"
  n_trials_per_fold: 100
  prev_study: ~
  top_fraction: 0.1
  enqueue_top_k: 3
  promote_top_frac: 0.50
  max_promotions: 10
  pruner_type: none

data:
  training_set: data/BTS_sample-splits.tsv
  zarr_base: /hpc/temp/ha_g/user/rpatton/ProteusZarrs
  subsample_frac: 1.00
  seed: 23

# =========================================================================
# GROUP 1: Structural HPs  (8 - loss weights)
# =========================================================================
structural:
  beta_point_mse: 0.30
  beta_background: 2.0
  beta_tcvae: 2.0
  beta_contrastive: 1.0
  beta_grl: 0.15
  beta_reconstruction: 0.50
  cl_margin: 1.0
  internal_weight: 1.0


# =========================================================================
# GROUP 2: Training HPs  (7 - optimizer, schedule, regularisation)
# =========================================================================
training:
  # Bounds:
  epochs: 15
  patience: 3
  use_amp: true
  # Everything else
  # max_lr: 1.5e-3
  min_lr_ratio: 5.0e-4
  warmup_start_lr: 2.5e-4
  # warmup_frac: 0.10
  schedule_frac: 0.90
  # weight_decay: 5.0e-6
  max_grad_norm: 18.0
  max_lr:
    suggest: {type: float, low: 1.0e-3, high: 2.0e-3, step: 5.0e-5}
  # min_lr_ratio:
  #   suggest: {type: float, low: 1.0e-4, high: 1.0e-1, log: true}
  # warmup_start_lr:
  #   suggest: {type: float, low: 1.0e-4, high: 2.0e-3}
  warmup_frac:
    suggest: {type: float, low: 0.05, high: 0.15, step: 0.01}
  # schedule_frac:
  #   suggest: {type: float, low: 0.5, high: 0.9}  # 7.5-13.5 epochs
  weight_decay:
    suggest: {type: float, low: 1.0e-6, high: 5.0e-5, log: true}
  # max_grad_norm:
  #   suggest: {type: float, low: 10.0, high: 20.0}


# =========================================================================
# GROUP 3: Scale HPs  (14 - width, depth, capacity)
# =========================================================================
scale:
  signal_ksize: 6
  interaction_ksize: 3
  n_reductions: 3
  reduction_dilation: 3
  signal_encoder_width: 256
  encoder_start: 128  # (64 signal dims + 25 scalar dims) = 89 -> 128 (expand)
  latent_size: 64  # 128 > 64 (halving) > 2x64 (mean and var latents)
  decoder_start: 64 # 1:1 from merged latent (no expansion)
  mdn_hidden: 64 # 2x64 > 64 > 32 > mdn_final (mdn_final) > 6 MDN params
  # mdn_final: 16  # 16→6 vs 32→6: wider last hidden gives more room
  mdn_final:
    suggest: {type: categorical, choices: [16, 32]}
  signal_filters: 16
  initial_reduction_channels: 64
  # dropout_rate: 0.10
  dropout_rate:
    suggest: {type: float, low: 0.05, high: 0.15, step: 0.01}