# BioDVN PLCAv3 — finalization sweep v3-1
#
# Full-CV coordinated finalization pass. This reopens the reduction/funnel
# architecture choices that were fixed in biodvn_tune-plcav3_finalize, while
# keeping the fixed-schedule final-model evaluation contract.

name: biodvn_tune-plcav3_finalize_v3-1
output_dir: results_training/biodvn_plcav3_finalize_v3_1_tuning

transfer: ~

objective:
  metric: weighted_tumor_gvw_crps_mean
  direction: minimize

tuning:
  phase: "plcav3_v3-1_finalize"
  n_trials_per_fold: 64
  prev_study: biodvn_tune-plcav3_finalize
  top_fraction: 0.50
  enqueue_top_k: 6
  promote_top_frac: 0.0
  max_promotions: 0
  pruner_type: none

data:
  training_set: data/PLCA_sample-splits.tsv
  zarr_base: /hpc/temp/ha_g/user/rpatton/ProteusZarrs
  subsample_frac: 1.00
  seed: 23
  batch_mode: multi_source
  steps_per_epoch: 4000
  selection_metric: min_weighted_source_crps
  source_groups:
    CRPC-RA: [CRPC-RA]
    SCLC: [SCLC]
    Prostate-Synthetic: [PC-PDX]
    SCLC-Synthetic: [SCLC-PDX]

structural:
  beta_background: 1.0
  beta_kl:
    suggest: {type: categorical, choices: [1.5, 1.75, 2.0]}
  beta_contrastive: 1.0
  beta_tfx:
    suggest: {type: categorical, choices: [1.0, 1.5, 2.0]}
  beta_pht_consistency:
    suggest: {type: categorical, choices: [0.25, 0.50, 0.75]}
  beta_pht_uncertainty:
    suggest: {type: categorical, choices: [0.0, 0.50, 1.00]}
  beta_reconstruction:
    suggest: {type: categorical, choices: [0.5, 0.75, 1.0]}
  cl_margin: 1.0
  internal_weight:
    suggest: {type: categorical, choices: [0.25, 0.50, 0.75, 1.0]}

training:
  epochs: 100
  patience: 100
  use_amp: true
  ema_decay:
    suggest: {type: categorical, choices: [0.0, 0.95, 0.995]}
  grad_accum_steps: 4
  min_lr_ratio: 0.01
  warmup_start_lr: 1.0e-5
  warmup_frac: 0.05
  schedule_frac: 0.90
  max_grad_norm: 10.0
  max_lr:
    suggest: {type: float, low: 2.5e-4, high: 1.0e-3, log: true}
  weight_decay:
    suggest: {type: float, low: 1.0e-7, high: 5.0e-6, log: true}

scale:
  signal_ksize: 6
  interaction_ksize: 3
  n_reductions:
    suggest: {type: categorical, choices: [2, 3]}
  funnel_reduction_factor:
    suggest: {type: categorical, choices: [2, 4]}
  reduction_dilation: 3
  encoder_start: 256
  latent_size: 128
  decoder_start: 64
  mdn_hidden: 64
  mdn_final: 16
  signal_filters: 8
  initial_reduction_channels: 32
  dropout_rate:
    suggest: {type: categorical, choices: [0.15, 0.20, 0.25]}