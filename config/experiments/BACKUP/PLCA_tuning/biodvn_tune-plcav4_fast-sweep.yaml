# BioDVN PLCAv4 — fast fold-5 scout

name: biodvn_tune-plcav4_fast-sweep
output_dir: results_training/biodvn_plcav4_fast_sweep

transfer: ~

objective:
  metric: cohort_tumor_gvw_objective
  direction: maximize

tuning:
  phase: "plcav4_fast_sweep"
  n_trials_per_fold: 10
  prev_study: ~
  top_fraction: 0
  enqueue_top_k: 0
  promote_top_frac: 0
  max_promotions: 0
  pruner_type: hyperband

data:
  training_set: data/PLCA_sample-splits.tsv
  zarr_base: /hpc/temp/ha_g/user/rpatton/ProteusZarrs
  subsample_frac: 1.00
  seed: 23
  batch_mode: multi_source
  steps_per_epoch: 4000
  selection_metric: max_cohort_objective
  source_groups:
    CRPC-RA: [CRPC-RA]
    SCLC: [SCLC]
    Prostate-Synthetic: [PC-PDX]
    SCLC-Synthetic: [SCLC-PDX]

structural:
  beta_background: 1.0
  beta_kl:
    suggest: {type: categorical, choices: [0.5, 1.0, 1.5]}
  beta_contrastive: 1.0
  beta_tfx:
    suggest: {type: categorical, choices: [1.0, 1.5, 2.0]}
  beta_pht_consistency:
    suggest: {type: categorical, choices: [0.0, 0.5, 1.0, 1.5, 2.0]}
  beta_pht_uncertainty:
    suggest: {type: categorical, choices: [0.0, 0.5, 1.0, 1.5, 2.0]}
  beta_reconstruction:
    suggest: {type: categorical, choices: [0.5, 0.75, 1.0, 1.25, 1.5]}
  beta_srl_max:
    suggest: {type: categorical, choices: [0.0, 0.01, 0.05, 0.10, 0.25]}
  srl_delta:
    suggest: {type: categorical, choices: [0.5, 1.0, 2.0]}
  srl_start:
    suggest: {type: categorical, choices: [0, 5, 10]}
  srl_ramp:
    suggest: {type: categorical, choices: [10, 25, 50]}
  cl_margin: 1.0
  internal_weight: 0.5

training:
  epochs: 100
  patience: 10
  use_amp: false
  ema_decay: 0.0
  grad_accum_steps:
    suggest: {type: categorical, choices: [1, 2, 4]}
  min_lr_ratio: 0.01
  warmup_start_lr: 1.0e-5
  warmup_frac: 0.05
  schedule_frac: 0.90
  max_grad_norm: 10.0
  max_lr:
    suggest: {type: float, low: 1.0e-4, high: 1.0e-3, log: true}
  weight_decay:
    suggest: {type: float, low: 1.0e-9, high: 1.0e-7, log: true}

scale:
  signal_ksize:
    suggest: {type: categorical, choices: [3, 6, 9]}
  interaction_ksize:
    suggest: {type: categorical, choices: [3, 5, 7]}
  n_reductions: 3
  funnel_reduction_factor:
    suggest: {type: categorical, choices: [2, 4]}
  reduction_dilation: 3
  encoder_start: 256
  latent_size: 128
  decoder_start: 64
  mdn_hidden: 64
  mdn_final:
    suggest: {type: categorical, choices: [16, 32]}
  signal_filters:
    suggest: {type: categorical, choices: [4, 8, 16]}
  initial_reduction_channels:
    suggest: {type: categorical, choices: [16, 32, 64]}
  dropout_rate:
    suggest: {type: categorical, choices: [0.20, 0.25, 0.30]}