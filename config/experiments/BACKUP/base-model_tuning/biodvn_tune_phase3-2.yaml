# BioDVN Phase 3.2b – Final HP refinement (sequential 5-fold CV per trial)
#
# Changes from phase 3.1:
#   - MDN input changed from cat(z_mean, z_log_var) to reparameterized z
#   - Sequential CV mode (all 5 folds per trial → true mean across folds)
#   - Objective: minimize tumor_gvw_crps_mean
#   - Cemented: mdn_final=32, warmup_frac=0.10
#   - prev_study seeds from phase 3.1 best configs (active params only)

name: biodvn_tune_phase3-2b
output_dir: results_training/biodvn_phase3_2b_training

transfer: ~

objective:
  metric: tumor_gvw_crps_mean
  direction: minimize

tuning:
  phase: "3.2b"
  n_trials_per_fold: 1              # per-worker trial count (20 workers × 1 = 20 total)
  prev_study: ~
  top_fraction: 0.1
  enqueue_top_k: 0
  pruner_type: none

data:
  training_set: data/BTS_sample-splits.tsv
  zarr_base: /hpc/temp/ha_g/user/rpatton/ProteusZarrs
  subsample_frac: 1.00
  seed: 23

# =========================================================================
# GROUP 1: Structural HPs  (all fixed at phase 3.0 winners)
# =========================================================================
structural:
  beta_point_mse: 0.30
  beta_background: 2.0
  beta_tcvae: 2.0
  beta_contrastive: 1.0
  beta_grl: 0.15
  beta_reconstruction: 0.50
  cl_margin: 1.0
  internal_weight: 1.0


# =========================================================================
# GROUP 2: Training HPs
# =========================================================================
training:
  epochs: 15
  patience: 3
  use_amp: true
  min_lr_ratio: 5.0e-4
  warmup_start_lr: 2.5e-4
  warmup_frac: 0.10
  schedule_frac: 0.90
  max_grad_norm: 18.0
  max_lr:
    suggest: {type: float, low: 0.0010, high: 0.0020, step: 0.0001}
  weight_decay:
    suggest: {type: float, low: 3.0e-6, high: 1.5e-5, log: true}


# =========================================================================
# GROUP 3: Scale HPs
# =========================================================================
scale:
  signal_ksize: 6
  interaction_ksize: 3
  n_reductions: 3
  reduction_dilation: 3
  signal_encoder_width: 256
  encoder_start: 128
  latent_size: 64
  decoder_start: 64
  mdn_hidden: 64
  mdn_final: 32
  signal_filters: 16
  initial_reduction_channels: 64
  dropout_rate:
    suggest: {type: float, low: 0.05, high: 0.20, step: 0.05}
