# Proteus PLCA model no-seq — 5-fold cross-validation (BioDVN_NoSeq)
#
# Fixed PLCAv3 finalized defaults, aligned to the v3-4 finalize study and the
# selected best-trial settings for the production no-seq full-CV run. CV uses
# the same multi-source sampling contract as tuning and emits OOF predictions
# from final_model.pt on the fixed 100-epoch schedule.

name: proteus_plca-model_no-seq_cv
output_dir: results_training/proteus_plca-model_no-seq_cv

transfer: ~

objective:
  metric: weighted_tumor_gvw_crps_max
  direction: minimize

tuning: ~

data:
  training_set: data/PLCA_sample-splits.tsv
  zarr_base: /hpc/temp/ha_g/user/rpatton/ProteusZarrs
  subsample_frac: 1.00
  seed: 23
  batch_mode: multi_source
  steps_per_epoch: 4000
  selection_metric: min_weighted_source_crps
  source_groups:
    CRPC-RA: [CRPC-RA]
    SCLC: [SCLC]
    Prostate-Synthetic: [PC-PDX]
    SCLC-Synthetic: [SCLC-PDX]

structural:
  beta_ccc: 1.0
  beta_background: 1.0
  beta_kl: 1.0
  beta_contrastive: 1.0
  beta_tfx: 2.0
  beta_pht_consistency: 0.0
  beta_pht_uncertainty: 1.5
  beta_reconstruction: 1.25
  cl_margin: 1.0
  internal_weight: 0.5

training:
  epochs: 100
  patience: 100
  use_amp: true
  ema_decay: 0.0
  grad_accum_steps: 4
  min_lr_ratio: 0.01
  warmup_start_lr: 1.0e-5
  warmup_frac: 0.05
  schedule_frac: 0.90
  max_grad_norm: 10.0
  max_lr: 4.0e-4
  weight_decay: 2.0e-8

scale:
  signal_ksize: 6
  interaction_ksize: 3
  n_reductions: 3
  funnel_reduction_factor: 4
  reduction_dilation: 3
  encoder_start: 256
  latent_size: 128
  decoder_start: 64
  mdn_hidden: 64
  mdn_final: 16
  signal_filters: 8
  initial_reduction_channels: 32
  dropout_rate: 0.25
