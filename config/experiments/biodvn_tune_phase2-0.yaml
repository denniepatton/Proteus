# BioDVN Phase 2.0 – HP Screening (100% of data)
#
# Fixed values are held constant; any parameter with a "suggest" block
# is searched by Optuna.  Comment/uncomment suggest blocks to control
# which HPs are active in each run.

name: biodvn_tune_phase2-0
output_dir: results_training/biodvn_phase2_0_training

transfer: ~

objective:
  metric: tumor_gvw_mean_r2_mean
  direction: maximize

tuning:
  phase: "2.0"
  n_trials_per_fold: 100
  prev_study: ~
  top_fraction: 0.1
  enqueue_top_k: 3
  promote_top_frac: 0.10
  max_promotions: 3

data:
  training_set: data/BTS_sample-splits.tsv
  zarr_base: /hpc/temp/ha_g/user/rpatton/ProteusZarrs
  subsample_frac: 1.00
  seed: 23

# =========================================================================
# GROUP 1: Structural HPs  (8 - loss weights)
# =========================================================================
structural:
  # beta_point_mse: 0.0
  beta_background: 1.5
  beta_tcvae: 2.5
  beta_contrastive: 1.0
  beta_grl: 0.20
  beta_reconstruction: 0.5
  cl_margin: 0.5
  internal_weight: 0.5
  beta_point_mse:
    suggest: {type: float, low: 0.0, high: 1.0}
  # beta_background:
  #   suggest: {type: float, low: 0.5, high: 3.0, log: true}
  # beta_tcvae:
  #   suggest: {type: float, low: 1.0, high: 5.0, log: true}
  # beta_contrastive:
  #   suggest: {type: float, low: 0.5, high: 5.0, log: true}
  # beta_grl:
  #   suggest: {type: float, low: 0.05, high: 1.0, log: true}
  # beta_reconstruction:
  #   suggest: {type: float, low: 0.1, high: 2.0, log: true}
  # cl_margin:
  #   suggest: {type: float, low: 0.2, high: 2.0, log: true}
  # internal_weight:
  #   suggest: {type: float, low: 0.1, high: 3.0, log: true}


# =========================================================================
# GROUP 2: Training HPs  (7 - optimizer, schedule, regularisation)
# =========================================================================
# N.B. 1 epoch on 30% of data (4 folds, ~80% of total) is ~20250 steps
training:
  # Bounds:
  epochs: 21
  patience: 3
  use_amp: true
  # Everything else
  # max_lr: 0.001
  # min_lr_ratio: 0.01
  # warmup_start_lr: 1e-4
  # warmup_frac: 0.05
  # schedule_frac: 0.70
  # weight_decay: 1e-4
  # max_grad_norm: 5.0
  max_lr:
    suggest: {type: float, low: 5.0e-4, high: 5.0e-3, log: true}
  min_lr_ratio:
    suggest: {type: float, low: 1.0e-4, high: 1.0e-1, log: true}
  warmup_start_lr:
    suggest: {type: float, low: 0.0, high: 1.0e-3}
  warmup_frac:
    suggest: {type: float, low: 0.01, high: 0.10}
  schedule_frac:
    suggest: {type: float, low: 0.5, high: 1.0}  # 10-20 epochs
  weight_decay:
    suggest: {type: float, low: 1.0e-5, high: 1.0e-3, log: true}
  max_grad_norm:
    suggest: {type: float, low: 2.5, high: 10.0}


# =========================================================================
# GROUP 3: Scale HPs  (13 - width, depth, capacity)
# =========================================================================
scale:
  signal_ksize: 3
  interaction_ksize: 3
  n_reductions: 3
  reduction_dilation_small: 2
  reduction_dilation_large: 7
  encoder_start: 128
  latent_size: 16
  decoder_start: 8
  mdn_hidden: 32
  mdn_final: 32
  signal_filters: 16
  initial_reduction_channels: 64
  # dropout_rate: 0.20
  # signal_ksize:
  #   suggest: {type: categorical, choices: [3, 6, 9]}
  # interaction_ksize:
  #   suggest: {type: categorical, choices: [3, 6, 9]}
  # n_reductions:
  #   suggest: {type: int, low: 1, high: 5}
  # reduction_dilation_small:
  #   suggest: {type: categorical, choices: [1, 2, 3]}
  # reduction_dilation_large:
  #   suggest: {type: categorical, choices: [3, 7, 11, 15]}
  # encoder_start:
  #   suggest: {type: categorical, choices: [64, 128, 256]}
  # latent_size:
  #   suggest: {type: categorical, choices: [16, 32, 64]}
  # decoder_start:
  #   suggest: {type: categorical, choices: [8, 16, 32]}
  # mdn_hidden:
  #   suggest: {type: categorical, choices: [32, 64]}
  # mdn_final:
  #   suggest: {type: categorical, choices: [8, 16, 32]}
  # signal_filters:
  #   suggest: {type: categorical, choices: [8, 16, 32]}
  # initial_reduction_channels:
  #   suggest: {type: categorical, choices: [32, 64, 128]}
  dropout_rate:
    suggest: {type: float, low: 0.10, high: 0.30}