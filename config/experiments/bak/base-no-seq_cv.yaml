# Proteus base-model no-seq — 5-fold cross-validation (BioDVN_NoSeq)
#
# Identical HPs to base_cv.yaml. Uses BioDVN_NoSeq (drops nucleotide channels).
# patience=999 ensures all 15 epochs run (final-epoch predictions for CV).

name: proteus_base-model_no-seq_cv
output_dir: results_training/proteus_base-model_no-seq_cv

transfer: ~

objective:
  metric: tumor_gvw_crps_mean
  direction: minimize

tuning: ~

data:
  training_set: data/BTS_sample-splits.tsv
  zarr_base: /hpc/temp/ha_g/user/rpatton/ProteusZarrs
  subsample_frac: 1.00
  seed: 23

structural:
  beta_point_mse: 0.30
  beta_background: 2.0
  beta_tcvae: 2.0
  beta_contrastive: 1.0
  beta_grl: 0.15
  beta_reconstruction: 0.50
  cl_margin: 1.0
  internal_weight: 1.0

training:
  epochs: 15
  patience: 999
  use_amp: true
  min_lr_ratio: 5.0e-4
  warmup_start_lr: 2.5e-4
  warmup_frac: 0.10
  schedule_frac: 0.90
  max_grad_norm: 18.0
  max_lr: 0.0015
  weight_decay: 1.0e-5

scale:
  signal_ksize: 6
  interaction_ksize: 3
  n_reductions: 3
  reduction_dilation: 3
  signal_encoder_width: 256
  encoder_start: 128
  latent_size: 64
  decoder_start: 64
  mdn_hidden: 64
  mdn_final: 32
  signal_filters: 16
  initial_reduction_channels: 64
  dropout_rate: 0.20
