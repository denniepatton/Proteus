# Proteus TDS model only-seq — final full training (BioDVN_OnlySeq)
#
# Fixed TDS finalized defaults from trial 00004. Full-train uses the same
# multi-source sampling contract as finalize tuning on 100% of the TDS TSV
# and saves the terminal epoch state as full_train/final_model.pt.

name: proteus_tds-model_only-seq
output_dir: trained_models/proteus_tds-model_only-seq

transfer: ~

objective:
  metric: cohort_tumor_soft_objective_mean
  direction: minimize

tuning: ~

data:
  training_set: data/TDS_sample-splits.tsv
  subsample_frac: 1.00
  seed: 23
  batch_mode: multi_source
  steps_per_epoch: 4000
  selection_metric: min_cohort_soft_objective
  source_groups:
    CRPC-RA: [CRPC-RA]
    SCLC: [SCLC]
    Prostate-Synthetic: [PC-PDX]
    SCLC-Synthetic: [SCLC-PDX]

structural:
  beta_background: 1.0
  beta_kl: 1.0
  beta_contrastive: 1.0
  beta_tfx: 0.25
  beta_pht_consistency: 0.5
  beta_pht_uncertainty: 0.0
  beta_reconstruction: 3.0
  beta_srl_max: 1.5
  beta_dynamic_pair_max: 0.0
  srl_delta: 1.0
  srl_start: 5
  srl_ramp: 85
  cl_margin: 1.0
  internal_weight: 0.5

training:
  epochs: 100
  patience: 100
  use_amp: true
  ema_decay: 0.995
  grad_accum_steps: 1
  min_lr_ratio: 0.01
  warmup_start_lr: 1.0e-5
  warmup_frac: 0.056
  schedule_frac: 0.90
  max_grad_norm: 10.0
  max_lr: 1.5e-4
  weight_decay: 0.0

scale:
  signal_ksize: 3
  interaction_ksize: 5
  n_reductions: 3
  funnel_reduction_factor: 4
  reduction_dilation: 3
  encoder_start: 256
  latent_size: 64
  decoder_start: 32
  mdn_hidden: 32
  mdn_final: 16
  signal_filters: 16
  initial_reduction_channels: 64
  dropout_rate: 0.25