# BioDVN Phase 2.5 – HP Screening (100% of data)
#
# Fixed values are held constant; any parameter with a "suggest" block
# is searched by Optuna.  Comment/uncomment suggest blocks to control
# which HPs are active in each run.

name: biodvn_tune_phase2-5
output_dir: results_training/biodvn_phase2_5_training

transfer: ~

objective:
  metric: tumor_gvw_crps_mean
  direction: minimize

tuning:
  phase: "2.5"
  n_trials_per_fold: 100
  prev_study: ~
  top_fraction: 0.1
  enqueue_top_k: 3
  promote_top_frac: 0.10
  max_promotions: 3

data:
  training_set: data/BTS_sample-splits.tsv
  zarr_base: /hpc/temp/ha_g/user/rpatton/ProteusZarrs
  subsample_frac: 1.00
  seed: 23

# =========================================================================
# GROUP 1: Structural HPs  (8 - loss weights)
# =========================================================================
structural:
  beta_point_mse: 0.10
  beta_background: 3.0
  beta_tcvae: 3.0
  beta_contrastive: 1.0
  beta_grl: 0.20
  beta_reconstruction: 0.50
  cl_margin: 1.0
  internal_weight: 1.0
  # beta_point_mse:
  #   suggest: {type: float, low: 0.0, high: 1.5}
  # beta_background:
  #   suggest: {type: float, low: 0.5, high: 5.0, log: true}
  # beta_tcvae:
  #   suggest: {type: float, low: 1.0, high: 5.0, log: true}
  # beta_contrastive:
  #   suggest: {type: float, low: 0.5, high: 3.0, log: true}
  # beta_grl:
  #   suggest: {type: float, low: 0.05, high: 2.0, log: true}
  # beta_reconstruction:
  #   suggest: {type: float, low: 0.1, high: 3.0, log: true}
  # cl_margin:
  #   suggest: {type: float, low: 0.1, high: 2.0, log: true}
  # internal_weight:
  #   suggest: {type: float, low: 0.1, high: 3.0, log: true}


# =========================================================================
# GROUP 2: Training HPs  (7 - optimizer, schedule, regularisation)
# =========================================================================
training:
  # Bounds:
  epochs: 15
  patience: 5
  use_amp: true
  # Everything else
  max_lr: 1.5e-3
  min_lr_ratio: 5.0e-4
  warmup_start_lr: 2.5e-4
  warmup_frac: 0.10
  schedule_frac: 0.90
  weight_decay: 5.0e-6
  max_grad_norm: 18.0
  # max_lr:
  #   suggest: {type: float, low: 1.0e-3, high: 2.0e-3, log: true}
  # min_lr_ratio:
  #   suggest: {type: float, low: 1.0e-4, high: 5.0e-2, log: true}
  # warmup_start_lr:
  #   suggest: {type: float, low: 0.0, high: 1.0e-3}
  # warmup_frac:
  #   suggest: {type: float, low: 0.01, high: 0.10}
  # schedule_frac:
  #   suggest: {type: float, low: 0.5, high: 0.9}  # 10-18 epochs
  # weight_decay:
  #   suggest: {type: float, low: 1.0e-6, high: 1.0e-4, log: true}
  # max_grad_norm:
  #   suggest: {type: float, low: 10.0, high: 20.0}


# =========================================================================
# GROUP 3: Scale HPs  (14 - width, depth, capacity)
# =========================================================================
scale:
  # signal_ksize: 3
  # interaction_ksize: 3
  # n_reductions: 3
  # reduction_dilation_small: 2
  # reduction_dilation_large: 7
  # signal_encoder_width: 1024
  # encoder_start: 128
  # latent_size: 16
  # decoder_start: 8
  # mdn_hidden: 32
  # mdn_final: 32
  # signal_filters: 16
  # initial_reduction_channels: 64
  dropout_rate: 0.10
  signal_ksize:
    suggest: {type: categorical, choices: [3, 6, 9]}
  interaction_ksize:
    suggest: {type: categorical, choices: [6, 9, 12]}
  n_reductions:
    suggest: {type: int, low: 2, high: 4}
  reduction_dilation_small:
    suggest: {type: categorical, choices: [1, 2, 3]}
  reduction_dilation_large:
    suggest: {type: categorical, choices: [3, 5, 7]}
  signal_encoder_width:
    suggest: {type: categorical, choices: [128, 256, 512]}
  encoder_start:
    suggest: {type: categorical, choices: [32, 64, 128]}
  latent_size:
    suggest: {type: categorical, choices: [32, 64, 128]}
  decoder_start:
    suggest: {type: categorical, choices: [8, 16, 32]}
  mdn_hidden:
    suggest: {type: categorical, choices: [16, 32, 64]}
  mdn_final:
    suggest: {type: categorical, choices: [8, 16, 32]}
  signal_filters:
    suggest: {type: categorical, choices: [4, 8, 16]}
  initial_reduction_channels:
    suggest: {type: categorical, choices: [16, 32, 64]}
  # dropout_rate:
  #   suggest: {type: float, low: 0.05, high: 0.20}