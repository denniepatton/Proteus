# Proteus PLCA model only-seq — 5-fold cross-validation (BioDVN_OnlySeq)
#
# Fixed PLCAv4 finalized defaults, aligned to the v1-2 finalize study defaults
# plus the selected production HP values. CV uses the same multi-source
# sampling contract as tuning and emits OOF predictions from final_model.pt on
# the fixed 100-epoch schedule.

name: proteus_plca-model_only-seq_cv
output_dir: results_training/proteus_plca-model_only-seq_cv

transfer: ~

objective:
  metric: cohort_tumor_soft_objective_mean
  direction: minimize

tuning: ~

data:
  training_set: data/PLCA_sample-splits.tsv
  zarr_base: ${PROTEUS_ZARR_BASE:-data/zarr}
  subsample_frac: 1.00
  seed: 23
  batch_mode: multi_source
  steps_per_epoch: 4000
  selection_metric: min_cohort_soft_objective
  source_groups:
    CRPC-RA: [CRPC-RA]
    SCLC: [SCLC]
    Prostate-Synthetic: [PC-PDX]
    SCLC-Synthetic: [SCLC-PDX]

structural:
  beta_background: 1.0
  beta_kl: 1.0
  beta_contrastive: 1.0
  beta_tfx: 0.5
  beta_pht_consistency: 1.0
  beta_pht_uncertainty: 1.0
  beta_reconstruction: 3.0
  beta_srl_max: 2.0
  srl_delta: 5.0
  srl_start: 0
  srl_ramp: 50
  cl_margin: 1.0
  internal_weight: 0.5

training:
  epochs: 100
  patience: 100
  use_amp: false
  ema_decay: 0.995
  grad_accum_steps: 1
  min_lr_ratio: 0.01
  warmup_start_lr: 1.0e-5
  warmup_frac: 0.05
  schedule_frac: 0.90
  max_grad_norm: 10.0
  max_lr: 1.5e-4
  weight_decay: 0.0

scale:
  signal_ksize: 3
  interaction_ksize: 5
  n_reductions: 3
  funnel_reduction_factor: 4
  reduction_dilation: 3
  encoder_start: 256
  latent_size: 128
  decoder_start: 64
  mdn_hidden: 64
  mdn_final: 32
  signal_filters: 16
  initial_reduction_channels: 64
  dropout_rate: 0.25
